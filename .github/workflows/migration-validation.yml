name: ChatGPT migration validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.2
      - run: python scripts/validate_migration.py
      - run: python -m unittest discover -s scripts -p 'test_model_migration.py' -v
      - run: bash -n install.sh
      - run: bash install.sh --skill contract-review --dry-run
